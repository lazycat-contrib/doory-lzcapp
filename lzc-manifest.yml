application:
  subdomain: doory
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://web:8080/
services:
  db:
    # upstream: postgres:16-alpine
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_DB=doory
      - POSTGRES_USER=doory
      - POSTGRES_PASSWORD={{ stable_secret "db_password" }}
    binds:
      - /lzcapp/var/doory/pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U doory -d doory
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    # upstream: ghcr.io/shaongitbd/doory-backend:0.1.0
    image: ghcr.nju.edu.cn/shaongitbd/doory-backend:0.1.0
    depends_on:
      - db
    environment:
      - TZ=Asia/Shanghai
      - DJANGO_SETTINGS_MODULE=doory.settings.prod
      - DJANGO_SECRET_KEY={{ stable_secret "django_secret" }}
      - DJANGO_ALLOWED_HOSTS=*
      - SITE_URL=https://doory.{{ .S.Domain }}
      - CSRF_TRUSTED_ORIGINS=https://doory.{{ .S.Domain }}
      - SECURE_SSL_REDIRECT=false
      - SECURE_COOKIES=false
      - NUM_PROXIES=1
      - DATABASE_URL=postgres://doory:{{ stable_secret "db_password" }}@db:5432/doory
      - CACHE_URL=dbcache://doory_cache
      - MEDIA_ROOT=/app/media
      - EXPORT_STORAGE_ROOT=/app/exports
      - EXPORT_RENDER_PAGE_URL=http://web:8080/render.html
    binds:
      - /lzcapp/var/doory/media:/app/media
      - /lzcapp/var/doory/exports:/app/exports
    shm_size: 512m
    healthcheck:
      test:
        - CMD
        - python
        - /app/healthcheck.py
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
  realtime:
    # 实时协作（WebSocket），同 backend 镜像
    image: ghcr.nju.edu.cn/shaongitbd/doory-backend:0.1.0@sha256:0d37e7176d9df586fae56b8367ac68ff3ae7c585df6d72d13fffd92bf432bf6a
    depends_on:
      - api
    environment:
      - TZ=Asia/Shanghai
      - DJANGO_SETTINGS_MODULE=doory.settings.prod
      - DJANGO_SECRET_KEY={{ stable_secret "django_secret" }}
      - DJANGO_ALLOWED_HOSTS=*
      - SITE_URL=https://doory.{{ .S.Domain }}
      - CSRF_TRUSTED_ORIGINS=https://doory.{{ .S.Domain }}
      - SECURE_SSL_REDIRECT=false
      - SECURE_COOKIES=false
      - NUM_PROXIES=1
      - DATABASE_URL=postgres://doory:{{ stable_secret "db_password" }}@db:5432/doory
      - CACHE_URL=dbcache://doory_cache
      - MEDIA_ROOT=/app/media
      - HEALTH_PORT=8001
    binds:
      - /lzcapp/var/doory/media:/app/media
    command:
      - uvicorn
      - doory.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
      - --ws
      - auto
      - --ws-max-size
      - "2097152"
      - --lifespan
      - "off"
      - --no-server-header
      - --timeout-graceful-shutdown
      - "20"
    healthcheck:
      test:
        - CMD
        - python
        - /app/healthcheck.py
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    # upstream: ghcr.io/shaongitbd/doory-frontend:0.1.0
    image: ghcr.nju.edu.cn/shaongitbd/doory-frontend:0.1.0
    depends_on:
      - api
      - realtime
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/doory/media:/srv/media:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
